<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WordWall AI 學習神器</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
body { background: linear-gradient(135deg, #f8fafc 0%, #f0f9ff 50%, #f8fafc 100%); font-family: system-ui, -apple-system, sans-serif; color: #1e293b; }
.card { background: rgba(255,255,255,0.9); border: 1.5px solid #e2e8f0; border-radius: 1rem; box-shadow: 0 4px 15px -3px rgba(148,163,184,0.12); }
.mode-btn { background: #fff; border: 1.5px solid #e2e8f0; border-radius: 0.75rem; padding: 0.75rem 0.5rem; font-size: 0.75rem; font-weight: 600; cursor: pointer; text-align: center; transition: all 0.15s; color: #475569; }
.mode-btn:hover { border-color: #a5b4fc; background: #eef2ff; color: #4338ca; }
.mode-btn.active { border-color: #6366f1; background: #eef2ff; color: #4338ca; }
.gen-btn { background: #6366f1; color: #fff; border: none; border-radius: 0.75rem; padding: 0.75rem; font-size: 0.95rem; font-weight: 600; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.5rem; transition: background 0.15s; }
.gen-btn:hover { background: #4f46e5; }
.gen-btn:disabled { background: #cbd5e1; cursor: not-allowed; }
.eg-chip { background: #eef2ff; color: #4338ca; border: none; border-radius: 1rem; padding: 3px 12px; font-size: 0.75rem; font-weight: 500; cursor: pointer; }
.eg-chip:hover { background: #c7d2fe; }
.flashcard { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 0.75rem; padding: 1rem; text-align: center; cursor: pointer; min-height: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: border-color 0.15s; }
.flashcard:hover { border-color: #a5b4fc; }
.flashcard .en { font-size: 1rem; font-weight: 600; color: #1e293b; }
.flashcard .zh { font-size: 0.8rem; color: #64748b; margin-top: 4px; display: none; }
.flashcard.flipped .zh { display: block; }
.flashcard.flipped .en { color: #6366f1; }
.qc { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 0.6rem; padding: 0.5rem 0.75rem; font-size: 0.8rem; cursor: pointer; color: #1e293b; text-align: left; transition: all 0.15s; }
.qc:hover { border-color: #a5b4fc; background: #eef2ff; color: #4338ca; }
.qc.correct { background: #dcfce7; border-color: #4ade80; color: #166534; }
.qc.wrong { background: #fee2e2; border-color: #f87171; color: #991b1b; }
.match-item { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 0.6rem; padding: 0.5rem 0.75rem; font-size: 0.8rem; margin-bottom: 5px; cursor: pointer; color: #1e293b; transition: all 0.15s; }
.match-item:hover { border-color: #a5b4fc; }
.match-item.sel { background: #eef2ff; border-color: #6366f1; color: #4338ca; }
.match-item.matched { background: #dcfce7; border-color: #4ade80; color: #166534; cursor: default; }
.fill-inp { border: none; border-bottom: 2px solid #6366f1; padding: 0 4px; width: 80px; font-size: 0.85rem; color: #6366f1; background: transparent; text-align: center; outline: none; }
.fill-inp.correct { border-color: #4ade80; color: #166534; }
.fill-inp.wrong { border-color: #f87171; color: #991b1b; }
.ww-word { border-radius: 0.6rem; padding: 6px 14px; font-size: 0.875rem; font-weight: 600; cursor: pointer; transition: transform 0.1s; }
.ww-word:hover { transform: scale(1.07); }
.spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }
.back-btn { display: inline-flex; align-items: center; gap: 5px; color: #6366f1; font-size: 0.85rem; font-weight: 500; text-decoration: none; margin-bottom: 1.5rem; }
.back-btn:hover { text-decoration: underline; }
</style>
</head>
<body class="min-h-screen p-4 md:p-8">
<div class="max-w-2xl mx-auto">

  <a href="index.html" class="back-btn">← 返回 Joyce's ABC Base</a>

  <div class="card p-6 mb-5">
    <div class="flex items-center gap-3 mb-1">
      <div class="w-10 h-10 bg-indigo-100 text-indigo-600 rounded-xl flex items-center justify-center text-xl">🧩</div>
      <div>
        <h1 class="text-xl font-extrabold text-slate-800">WordWall AI 學習神器</h1>
        <p class="text-xs text-slate-400">將任何教材轉化為互動學習資源</p>
      </div>
    </div>
  </div>

  <!-- 輸入區 -->
  <div class="card p-5 mb-4">
    <label class="text-xs font-bold text-slate-500 uppercase tracking-wide block mb-2">輸入學習內容（英文 中文，逗號分隔）</label>
    <textarea id="inputText" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm text-slate-700 resize-none focus:outline-none focus:border-indigo-400" rows="3" placeholder="例：apple 蘋果, banana 香蕉, cat 貓, dog 狗, sun 太陽, moon 月亮"></textarea>
    <div class="flex flex-wrap gap-2 mt-3">
      <span class="text-xs text-slate-400 self-center">快速範例：</span>
      <button class="eg-chip" onclick="fill('animals')">🐾 動物</button>
      <button class="eg-chip" onclick="fill('colors')">🎨 顏色</button>
      <button class="eg-chip" onclick="fill('greetings')">👋 問候語</button>
      <button class="eg-chip" onclick="fill('numbers')">🔢 數字</button>
      <button class="eg-chip" onclick="fill('food')">🍎 食物</button>
    </div>
  </div>

  <!-- 模式選擇 -->
  <div class="card p-5 mb-4">
    <label class="text-xs font-bold text-slate-500 uppercase tracking-wide block mb-3">選擇遊戲模式</label>
    <div class="grid grid-cols-3 gap-2 sm:grid-cols-6">
      <div class="mode-btn active" onclick="selMode(this,'flashcard')"><div class="text-lg mb-1">🃏</div>翻翻卡</div>
      <div class="mode-btn" onclick="selMode(this,'quiz')"><div class="text-lg mb-1">❓</div>選擇題</div>
      <div class="mode-btn" onclick="selMode(this,'match')"><div class="text-lg mb-1">🔗</div>連連看</div>
      <div class="mode-btn" onclick="selMode(this,'fill')"><div class="text-lg mb-1">✏️</div>填填看</div>
      <div class="mode-btn" onclick="selMode(this,'wall')"><div class="text-lg mb-1">🌈</div>單字牆</div>
      <div class="mode-btn" onclick="selMode(this,'sentence')"><div class="text-lg mb-1">💬</div>造句</div>
    </div>
  </div>

  <button class="gen-btn" id="genBtn" onclick="generate()">✨ 生成學習活動</button>

  <!-- 輸出區 -->
  <div id="outputZone" class="card p-5 mt-4" style="display:none">
    <div class="flex items-center justify-between mb-4">
      <h2 class="font-bold text-slate-700" id="outTitle">學習活動</h2>
      <button onclick="generate()" class="text-xs text-indigo-500 border border-indigo-200 rounded-lg px-3 py-1 hover:bg-indigo-50">🔀 重新出題</button>
    </div>
    <div id="outContent"></div>
  </div>

</div>

<script>
const EXAMPLES = {
  animals: 'cat 貓, dog 狗, bird 鳥, fish 魚, rabbit 兔子, elephant 大象, lion 獅子, tiger 老虎, monkey 猴子, bear 熊',
  colors: 'red 紅色, blue 藍色, yellow 黃色, green 綠色, purple 紫色, orange 橘色, pink 粉紅色, white 白色, black 黑色, brown 棕色',
  greetings: 'hello 你好, goodbye 再見, thank you 謝謝, please 請, sorry 對不起, good morning 早安, good night 晚安, yes 是, no 不是',
  numbers: 'one 一, two 二, three 三, four 四, five 五, six 六, seven 七, eight 八, nine 九, ten 十',
  food: 'apple 蘋果, banana 香蕉, milk 牛奶, bread 麵包, egg 蛋, rice 米飯, noodle 麵, cake 蛋糕, cookie 餅乾, juice 果汁'
};
let mode = 'flashcard';
let matchSel = null;

function fill(k) { document.getElementById('inputText').value = EXAMPLES[k]; }

function selMode(el, m) {
  mode = m;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
}

function parseWords(text) {
  const pairs = [];
  text.split(',').map(s => s.trim()).filter(Boolean).forEach(p => {
    const m = p.match(/^([a-zA-Z\s'\-]+)\s+([\u4e00-\u9fff\s]+)$/);
    if (m) pairs.push({ en: m[1].trim(), zh: m[2].trim() });
  });
  return pairs;
}

function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

async function generate() {
  const text = document.getElementById('inputText').value.trim();
  if (!text) { alert('請先輸入學習內容！'); return; }
  const btn = document.getElementById('genBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> 生成中...';

  let words = parseWords(text);
  if (words.length < 2) {
    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 600, messages: [{ role: 'user', content: `從以下文字找出英文單字和中文翻譯，只回 JSON：{"words":[{"en":"","zh":""}]}\n${text}` }] })
      });
      const data = await res.json();
      const parsed = JSON.parse(data.content.map(i => i.text||'').join('').replace(/```json|```/g,'').trim());
      words = parsed.words || [];
    } catch(e) { words = []; }
  }

  if (!words.length) {
    alert('未找到單字，請用「英文 中文」格式，例如：cat 貓, dog 狗');
    btn.disabled = false; btn.innerHTML = '✨ 生成學習活動'; return;
  }

  const titles = { flashcard:'🃏 翻翻卡', quiz:'❓ 選擇題', match:'🔗 連連看', fill:'✏️ 填填看', wall:'🌈 單字牆', sentence:'💬 造句練習' };
  document.getElementById('outTitle').textContent = titles[mode];
  document.getElementById('outputZone').style.display = 'block';
  matchSel = null;
  const el = document.getElementById('outContent');
  el.innerHTML = '';

  if (mode === 'flashcard') renderFlashcard(el, words);
  else if (mode === 'quiz') renderQuiz(el, words);
  else if (mode === 'match') renderMatch(el, words);
  else if (mode === 'fill') renderFill(el, words);
  else if (mode === 'wall') renderWall(el, words);
  else if (mode === 'sentence') await renderSentence(el, words);

  btn.disabled = false; btn.innerHTML = '✨ 生成學習活動';
}

function renderFlashcard(el, words) {
  el.innerHTML = '<p class="text-xs text-slate-400 mb-3">👆 點擊卡片翻面看中文</p><div class="grid grid-cols-2 sm:grid-cols-3 gap-3">' +
    shuffle(words).map(w => `<div class="flashcard" onclick="this.classList.toggle('flipped')"><div class="en">${w.en}</div><div class="zh">${w.zh}</div></div>`).join('') + '</div>';
}

function renderQuiz(el, words) {
  const qs = shuffle(words).slice(0, Math.min(5, words.length));
  el.innerHTML = qs.map((w, i) => {
    const choices = shuffle([w, ...shuffle(words.filter(x => x.zh !== w.zh)).slice(0, 3)]);
    return `<div class="mb-4 pb-4 border-b border-slate-100 last:border-0 last:mb-0 last:pb-0">
      <p class="text-sm font-semibold text-slate-700 mb-2">${i+1}. "${w.en}" 的中文是？</p>
      <div class="grid grid-cols-2 gap-2">${choices.map(c => `<button class="qc" onclick="checkQ(this,'${c.zh}','${w.zh}')">${c.zh}</button>`).join('')}</div>
    </div>`;
  }).join('');
}

function checkQ(btn, chosen, correct) {
  btn.closest('.grid').querySelectorAll('.qc').forEach(b => b.disabled = true);
  if (chosen === correct) btn.classList.add('correct');
  else { btn.classList.add('wrong'); btn.closest('.grid').querySelectorAll('.qc').forEach(b => { if (b.textContent === correct) b.classList.add('correct'); }); }
}

function renderMatch(el, words) {
  const ws = shuffle(words).slice(0, Math.min(6, words.length));
  const zhs = shuffle(ws);
  el.innerHTML = '<p class="text-xs text-slate-400 mb-3">👆 點左邊英文，再點右邊中文配對</p><div class="grid grid-cols-2 gap-3">' +
    `<div><p class="text-xs font-bold text-slate-400 mb-2">英文</p>${ws.map(w => `<div class="match-item" data-en="${w.en}" onclick="mClick(this,'en')">${w.en}</div>`).join('')}</div>` +
    `<div><p class="text-xs font-bold text-slate-400 mb-2">中文</p>${zhs.map(w => `<div class="match-item" data-en="${w.en}" onclick="mClick(this,'zh')">${w.zh}</div>`).join('')}</div>` +
    '</div>';
}

function mClick(el, side) {
  if (el.classList.contains('matched')) return;
  if (!matchSel) { matchSel = {el, side}; el.classList.add('sel'); return; }
  if (matchSel.side === side) { matchSel.el.classList.remove('sel'); matchSel = {el, side}; document.querySelectorAll('.match-item').forEach(i => i.classList.remove('sel')); el.classList.add('sel'); return; }
  const enEl = side === 'zh' ? matchSel.el : el;
  const zhEl = side === 'zh' ? el : matchSel.el;
  if (enEl.dataset.en === zhEl.dataset.en) { [enEl, zhEl].forEach(e => { e.classList.remove('sel'); e.classList.add('matched'); }); }
  else { [enEl, zhEl].forEach(e => e.classList.remove('sel')); }
  matchSel = null;
}

function renderFill(el, words) {
  const ws = shuffle(words).slice(0, Math.min(6, words.length));
  el.innerHTML = ws.map((w, i) => `<div class="mb-3 text-sm text-slate-700 leading-loose">${i+1}. ${w.zh}：<input class="fill-inp" data-ans="${w.en.toLowerCase()}" placeholder="______"></div>`).join('') +
    `<button onclick="checkFill()" class="mt-2 text-xs border border-slate-300 rounded-lg px-4 py-2 text-slate-600 hover:bg-slate-50">核對答案</button>`;
}

function checkFill() {
  document.querySelectorAll('.fill-inp').forEach(inp => {
    inp.classList.remove('correct', 'wrong');
    if (inp.value.trim().toLowerCase() === inp.dataset.ans) inp.classList.add('correct');
    else if (inp.value.trim()) inp.classList.add('wrong');
  });
}

function renderWall(el, words) {
  const cls = [['#EEF2FF','#4338CA'],['#DCFCE7','#166534'],['#FEF3C7','#92400E'],['#FCE7F3','#9D174D'],['#E0F2FE','#075985'],['#F3E8FF','#6B21A8']];
  el.innerHTML = '<p class="text-xs text-slate-400 mb-3">👆 點擊發音，滑鼠移上看中文</p><div class="flex flex-wrap gap-2">' +
    shuffle(words).map((w, i) => { const c = cls[i % cls.length]; return `<div class="ww-word" style="background:${c[0]};color:${c[1]}" onclick="speak('${w.en}')" title="${w.zh}">${w.en}</div>`; }).join('') + '</div>';
}

async function renderSentence(el, words) {
  el.innerHTML = '<p class="text-sm text-slate-400 text-center py-4">⏳ AI 生成例句中...</p>';
  const ws = shuffle(words).slice(0, Math.min(4, words.length));
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 600, messages: [{ role: 'user', content: `為以下單字各造一個適合4-6歲的英文例句（8字內）。只回 JSON：{"sentences":[{"word":"","en":"","zh":""}]}\n單字：${ws.map(w=>w.en).join(', ')}` }] })
    });
    const data = await res.json();
    const parsed = JSON.parse(data.content.map(i=>i.text||'').join('').replace(/```json|```/g,'').trim());
    el.innerHTML = parsed.sentences.map(s => `
      <div class="mb-4 pb-4 border-b border-slate-100 last:border-0 last:mb-0 last:pb-0">
        <span class="text-xs font-bold text-indigo-400 uppercase">${s.word}</span>
        <p class="text-base font-semibold text-slate-800 cursor-pointer mt-1" onclick="speak('${s.en}')">${s.en} <span class="text-slate-300 text-sm">🔊</span></p>
        <p class="text-sm text-slate-400">${s.zh}</p>
      </div>`).join('');
  } catch(e) { el.innerHTML = '<p class="text-sm text-red-400">生成失敗，請重試。</p>'; }
}

function speak(w) {
  if ('speechSynthesis' in window) { const u = new SpeechSynthesisUtterance(w); u.lang = 'en-US'; u.rate = 0.85; speechSynthesis.speak(u); }
}
</script>
</body>
</html>
