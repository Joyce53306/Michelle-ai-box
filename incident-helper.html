<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>突發事件協助助手</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
    body { background: linear-gradient(135deg, #f8fafc 0%, #fef2f2 50%, #f8fafc 100%); }
    .card { background: rgba(255,255,255,0.9); border: 1.5px solid #e2e8f0; border-radius: 1rem; padding: 1.5rem; }
    .gen-btn { background: #9333ea; color: white; width: 100%; padding: 0.8rem; border-radius: 0.75rem; font-weight: 600; }
</style>
</head>
<body class="p-4 md:p-8">
<div class="max-w-2xl mx-auto">
    <a href="index.html" class="text-purple-600 mb-6 block">← 返回控制台</a>
    <div class="card mb-6">
        <h1 class="text-xl font-bold mb-4">🚨 突發事件協助 (Prompt 生成版)</h1>
        <div class="space-y-4">
            <div>
                <label class="text-xs font-bold text-slate-400 uppercase">事件摘要</label>
                <textarea id="content" class="w-full border p-2 rounded" rows="3" placeholder="簡述發生了什麼事（例如：小朋友發生碰撞、東西遺失、情緒失控...）"></textarea>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <input type="text" id="child" class="border p-2 rounded" placeholder="孩子名字">
                <select id="tone" class="border p-2 rounded">
                    <option>溫暖親切 (適合小狀況)</option>
                    <option>正式專業 (適合處理爭議)</option>
                    <option>冷靜客觀 (適合嚴重受傷事件)</option>
                </select>
            </div>
            <button onclick="generatePrompt()" class="gen-btn">📋 生成事件處理指令</button>
        </div>
    </div>

    <div id="resultCard" class="card hidden">
        <h2 class="font-bold mb-2">請複製下方指令，貼給 AI：</h2>
        <textarea id="finalPrompt" class="w-full h-40 p-3 bg-slate-100 text-xs rounded mb-3" readonly></textarea>
        <button onclick="copyToClipboard()" class="w-full border border-purple-600 text-purple-600 py-2 rounded-lg font-bold">複製到剪貼簿</button>
    </div>
</div>

<script>
function generatePrompt() {
    const content = document.getElementById('content').value || '未填';
    const child = document.getElementById('child').value || '學生';
    const tone = document.getElementById('tone').value;
    
    const prompt = `你是一位資深的幼兒園主任。請幫我草擬一封給家長的信，處理以下突發事件：
事件對象：${child}
事件內容：${content}
語氣要求：${tone}

要求：
1. 先表達關心，確保家長感受到我們對孩子的重視。
2. 客觀陳述事件經過，不帶責備。
3. 說明我們採取了哪些處理方式。
4. 強調我們對未來的預防與改善措施。
5. 雙語版本 (中文 + 英文)，文字要溫柔但有條理，結尾留出簽名欄。`;
    
    document.getElementById('finalPrompt').value = prompt;
    document.getElementById('resultCard').classList.remove('hidden');
}

function copyToClipboard() {
    const textarea = document.getElementById('finalPrompt');
    textarea.select();
    document.execCommand('copy');
    alert('已複製！請將此指令貼給 AI。');
}
</script>
</body>
</html>
