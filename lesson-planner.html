Joyce 老師，這份「備課神器」的邏輯非常棒！為了讓它在 GitHub Pages 上運作，我們必須把它轉為「Prompt 生成器」。這樣您不但能免費使用，還能隨時依照您與 Swan/Kangaroo 班級實際互動的狀況，微調生成的教案。

請將原本的 lesson-planner.html 內容完全覆蓋為以下版本：

HTML
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>備課神器 — 一週課程計畫</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
    body { background: linear-gradient(135deg, #f8fafc 0%, #f0fdf4 50%, #f8fafc 100%); font-family: system-ui, sans-serif; }
    .card { background: rgba(255,255,255,0.9); border: 1.5px solid #e2e8f0; border-radius: 1rem; padding: 1.5rem; }
    .gen-btn { background: #16a34a; color: white; width: 100%; padding: 0.8rem; border-radius: 0.75rem; font-weight: 600; }
</style>
</head>
<body class="p-4 md:p-8">
<div class="max-w-2xl mx-auto">
    <a href="index.html" class="text-green-600 mb-6 block">← 返回控制台</a>
    <div class="card mb-6">
        <h1 class="text-xl font-bold mb-4">💼 備課神器 (Prompt 生成版)</h1>
        <div class="grid grid-cols-2 gap-3 mb-3">
            <input type="text" id="theme" class="border p-2 rounded" placeholder="本週主題 (Animals)">
            <input type="text" id="vocab" class="border p-2 rounded" placeholder="本週單字 (cat, dog)">
        </div>
        <textarea id="notes" class="w-full border p-2 rounded mb-4" rows="2" placeholder="備註/特殊需求..."></textarea>
        <button onclick="generatePrompt()" class="gen-btn">📋 生成課程計畫指令</button>
    </div>

    <div id="resultCard" class="card hidden">
        <h2 class="font-bold mb-2">請複製下方指令，貼給 AI：</h2>
        <textarea id="finalPrompt" class="w-full h-40 p-3 bg-slate-100 text-xs rounded mb-3" readonly></textarea>
        <button onclick="copyToClipboard()" class="w-full border border-green-600 text-green-600 py-2 rounded-lg font-bold">複製到剪貼簿</button>
    </div>
</div>

<script>
function generatePrompt() {
    const theme = document.getElementById('theme').value || '未填';
    const vocab = document.getElementById('vocab').value || '未填';
    const notes = document.getElementById('notes').value || '無';
    
    const prompt = `你是一位專業幼兒園美語老師。請為我設計一份一週五天（Day 1-5）的英語課程計畫。
主題：${theme}
單字：${vocab}
備註：${notes}

要求：
1. 針對 4-6 歲幼兒，教學風格親切活潑。
2. 包含：每日目標、暖身、教學流程、收尾複習、亮點遊戲。
3. 語氣專業且充滿熱情。`;
    
    document.getElementById('finalPrompt').value = prompt;
    document.getElementById('resultCard').classList.remove('hidden');
}

function copyToClipboard() {
    const textarea = document.getElementById('finalPrompt');
    textarea.select();
    document.execCommand('copy');
    alert('已複製！現在貼給 AI 即可生成精準的教案。');
}
</script>
</body>
</html>
