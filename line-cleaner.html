<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LINE 文字清洗助手</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
/* (保留您原本的 CSS，無需變更) */
body { background: linear-gradient(135deg, #f8fafc 0%, #f0fdf4 50%, #f8fafc 100%); font-family: system-ui, -apple-system, sans-serif; color: #1e293b; }
.card { background: rgba(255,255,255,0.9); border: 1.5px solid #e2e8f0; border-radius: 1rem; box-shadow: 0 4px 15px -3px rgba(148,163,184,0.12); }
.gen-btn { background: #0d9488; color: #fff; border: none; border-radius: 0.75rem; padding: 0.8rem; font-size: 0.95rem; font-weight: 600; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
.spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body class="min-h-screen p-4 md:p-8">
<div class="max-w-2xl mx-auto">
    <button class="gen-btn" id="genBtn" onclick="clean()">✨ 清洗 + 重整格式</button>
</div>

<script>
// 1. API Key 安全儲存邏輯
let apiKey = localStorage.getItem('claude_api_key');

function getApiKey() {
    if (!apiKey) {
        apiKey = prompt("請輸入您的 Anthropic API Key (僅儲存於瀏覽器，確保安全):");
        if (apiKey) localStorage.setItem('claude_api_key', apiKey);
    }
    return apiKey;
}

// 2. 清洗邏輯
async function clean() {
    const key = getApiKey();
    if (!key) return;

    const input = document.getElementById('inputText').value.trim();
    if (!input) { alert('請先貼入要清洗的訊息'); return; }

    // 收集選項
    const opts = [];
    if (document.getElementById('c1').checked) opts.push('移除裝飾性 emoji，只保留必要的');
    if (document.getElementById('c2').checked) opts.push('移除所有 ** 粗體標記，還原成一般文字');
    if (document.getElementById('c3').checked) opts.push('刪除 AI 常見贅字（如「希望這封信找到您」等開場白）');
    if (document.getElementById('c4').checked) opts.push('濃縮壓縮，保留重點，刪除重複說法');
    if (document.getElementById('c5').checked) opts.push('語氣調整得更像真人老師，自然口語');
    if (document.getElementById('c6').checked) opts.push('適合 LINE 手機閱讀的段落和斷行');

    const purpose = document.getElementById('purpose').value;
    const tone = document.getElementById('tone').value;

    const btn = document.getElementById('genBtn');
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> 清洗中...';
    document.getElementById('outZone').style.display = 'block';
    document.getElementById('outContent').textContent = '⏳ 處理中...';

    try {
        const res = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST', 
            headers: { 
                'Content-Type': 'application/json',
                'x-api-key': key,
                'anthropic-version': '2023-06-01',
                'anthropic-dangerous-direct-browser-access': 'true'
            },
            body: JSON.stringify({ 
                model: 'claude-3-5-sonnet-20240620', 
                max_tokens: 800, 
                messages: [{ 
                    role: 'user', 
                    content: `你是文字編輯專家，幫幼兒園老師清洗 AI 生成訊息。\n原始訊息：\n${input}\n\n處理要求：\n${opts.map((o,i)=>`${i+1}. ${o}`).join('\n')}\n\n用途：${purpose}\n語氣：${tone}\n\n只輸出清洗後的訊息，不要任何說明。` 
                }] 
            }) 
        });
        
        const data = await res.json();
        const result = data.content ? data.content[0].text : '發生錯誤，請稍後再試。';
        document.getElementById('outContent').textContent = result;
        
        const diff = Math.round((1 - result.length / input.length) * 100);
        document.getElementById('diffNote').textContent = diff > 0 ? `已縮短約 ${diff}%（${input.length} → ${result.length} 字）` : '';
    } catch(e) { 
        document.getElementById('outContent').textContent = '連線失敗，請檢查 API Key 是否正確。'; 
    }
    btn.disabled = false; btn.innerHTML = '✨ 清洗 + 重整格式';
}

function copyOut() {
    navigator.clipboard.writeText(document.getElementById('outContent').textContent).then(() => {
        const btn = document.querySelector('.copy-btn');
        const orig = btn.innerHTML;
        btn.innerHTML = '✅ 已複製！'; 
        setTimeout(() => btn.innerHTML = orig, 1500);
    });
}
</script>
</body>
</html>
