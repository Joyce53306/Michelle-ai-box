<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>學生英語評量工具</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
    body { background: #f8fafc; font-family: system-ui, sans-serif; }
    .card { background: #fff; border: 1.5px solid #e2e8f0; border-radius: 1rem; padding: 1.5rem; }
    .obs-star { cursor: pointer; color: #e2e8f0; font-size: 20px; }
    .obs-star.lit { color: #f59e0b; }
</style>
</head>
<body class="p-4 md:p-8">
<div class="max-w-2xl mx-auto">
    <a href="index.html" class="text-purple-600 mb-6 block">← 返回控制台</a>
    
    <div class="card mb-6">
        <h1 class="text-xl font-bold mb-4">📋 學生學習觀察記錄</h1>
        <div class="grid grid-cols-2 gap-4 mb-4">
            <input type="text" id="stu-name" class="border p-2 rounded" placeholder="學生姓名">
            <input type="text" id="stu-class" class="border p-2 rounded" placeholder="班級">
        </div>
        
        <div class="space-y-4" id="score-area">
            <div class="flex justify-between items-center">
                <span>單字發音清晰度</span>
                <div class="flex gap-1" data-key="vocab" onclick="rate(event)">
                    <span class="obs-star">★</span><span class="obs-star">★</span><span class="obs-star">★</span><span class="obs-star">★</span><span class="obs-star">★</span>
                </div>
            </div>
            <div class="flex justify-between items-center">
                <span>句型應用意願</span>
                <div class="flex gap-1" data-key="sentence" onclick="rate(event)">
                    <span class="obs-star">★</span><span class="obs-star">★</span><span class="obs-star">★</span><span class="obs-star">★</span><span class="obs-star">★</span>
                </div>
            </div>
        </div>
        
        <button onclick="generateReport()" class="w-full mt-6 bg-purple-600 text-white py-3 rounded-xl font-bold hover:bg-purple-700">✨ 匯出評量記錄</button>
    </div>

    <div id="resultCard" class="card hidden">
        <h2 class="font-bold mb-2">評量摘要：</h2>
        <textarea id="finalReport" class="w-full h-40 p-3 bg-slate-100 text-sm rounded mb-3" readonly></textarea>
        <button onclick="window.print()" class="w-full border border-purple-600 text-purple-600 py-2 rounded-lg font-bold">🖨️ 列印評量單</button>
    </div>
</div>

<script>
function rate(e) {
    if(!e.target.classList.contains('obs-star')) return;
    const stars = e.target.parentElement.querySelectorAll('.obs-star');
    const index = Array.from(stars).indexOf(e.target);
    stars.forEach((s, i) => s.classList.toggle('lit', i <= index));
}

function generateReport() {
    const name = document.getElementById('stu-name').value || '該生';
    const report = `${name} 學習觀察記錄：
    
1. 單字發音表現：已觀察到學生在目標詞彙的發音掌握度。
2. 句型應用：在課堂互動中展現了口語表達的意願。
3. 教學建議：建議持續透過 David 冒險主題進行沉浸式聽力練習。
    
老師日期：${new Date().toLocaleDateString()}`;
    
    document.getElementById('finalReport').value = report;
    document.getElementById('resultCard').classList.remove('hidden');
}
</script>
</body>
</html>body>
</html>
