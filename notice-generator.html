<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>家長通知生成器 - Prompt 模式</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
    body { background: #f8fafc; font-family: system-ui, sans-serif; }
    .card { background: #fff; border: 1.5px solid #e2e8f0; border-radius: 1rem; padding: 1.5rem; }
</style>
</head>
<body class="p-4 md:p-8">
<div class="max-w-2xl mx-auto">
    <a href="index.html" class="text-purple-600 mb-6 block">← 返回控制台</a>
    <div class="card mb-6">
        <h1 class="text-xl font-bold mb-1">📩 家長通知草稿生成器</h1>
        <p class="text-sm text-slate-500 mb-6">設定內容，生成專業的溝通 Prompt</p>
        
        <div class="space-y-4">
            <select id="type" class="w-full border p-2 rounded">
                <option>聯絡簿訊息</option>
                <option>活動通知</option>
                <option>學習回饋</option>
                <option>請假/缺席說明</option>
            </select>
            <textarea id="content" class="w-full border p-2 rounded" rows="3" placeholder="請輸入您想告訴家長的核心內容..."></textarea>
            <button onclick="generatePrompt()" class="w-full bg-purple-600 text-white py-3 rounded-xl font-bold hover:bg-purple-700">📋 生成並複製指令</button>
        </div>
    </div>

    <div id="resultCard" class="card hidden">
        <h2 class="font-bold mb-2">指令已準備好：</h2>
        <textarea id="finalPrompt" class="w-full h-40 p-3 bg-slate-100 text-xs rounded mb-3" readonly></textarea>
        <button onclick="copyToClipboard()" class="w-full border border-purple-600 text-purple-600 py-2 rounded-lg font-bold">複製到剪貼簿</button>
    </div>
</div>

<script>
function generatePrompt() {
    const type = document.getElementById('type').value;
    const content = document.getElementById('content').value;
    
    const prompt = `你是一位專業且溫暖的幼兒園英語老師。請幫我撰寫一份「${type}」，內容如下：
    
${content}
    
要求：
1. 語氣溫暖親切，適合傳給家長。
2. 語言：提供「中文」與「英文」雙語版本。
3. 結構清楚，重點突出，簡潔易讀。`;
    
    document.getElementById('finalPrompt').value = prompt;
    document.getElementById('resultCard').classList.remove('hidden');
}

function copyToClipboard() {
    const textarea = document.getElementById('finalPrompt');
    textarea.select();
    document.execCommand('copy');
    alert('已複製！請貼到 AI 聊天視窗中即可生成通知內容。');
}
</script>
</body>
</html>
</html>
