<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEL 提問精靈 — Prompt 生成器</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
    body { background: #f8fafc; font-family: system-ui, sans-serif; }
    .card { background: #fff; border: 1.5px solid #e2e8f0; border-radius: 1rem; padding: 1.5rem; }
    .active-btn { background: #0d9488 !important; color: white !important; }
</style>
</head>
<body class="p-4 md:p-8">
<div class="max-w-2xl mx-auto">
    <a href="index.html" class="text-teal-600 mb-6 block">← 返回控制台</a>
    <div class="card mb-6">
        <h1 class="text-xl font-bold mb-1">📖 SEL 提問精靈</h1>
        <p class="text-sm text-slate-500 mb-4">設定好參數，一鍵生成高品質提問 Prompt</p>
        <textarea id="bookText" class="w-full border rounded-lg p-3 mb-4" rows="4" placeholder="請貼上繪本內容或故事概要..."></textarea>
        
        <button onclick="generatePrompt()" class="w-full bg-teal-600 text-white py-3 rounded-xl font-bold hover:bg-teal-700">📋 生成並複製提問指令 (Prompt)</button>
    </div>

    <div id="resultCard" class="card hidden">
        <h2 class="font-bold mb-2">已為您準備好指令：</h2>
        <textarea id="finalPrompt" class="w-full h-40 p-3 bg-slate-100 text-xs rounded mb-3" readonly></textarea>
        <button onclick="copyToClipboard()" class="w-full border border-teal-600 text-teal-600 py-2 rounded-lg font-bold">複製到剪貼簿</button>
    </div>
</div>

<script>
function generatePrompt() {
    const text = document.getElementById('bookText').value;
    const prompt = `你是一位幼兒園教育專家。請根據以下繪本內容，生成 8 題適合幼兒的 SEL (社會情緒學習) 提問：
    
繪本內容：${text}
    
請分為兩組：
1. 理解提問：針對故事情節。
2. SEL情感提問：引導孩子反思情緒、同理心與解決問題。
請使用簡單、溫暖的語言，適齡 3-6 歲。`;
    
    document.getElementById('finalPrompt').value = prompt;
    document.getElementById('resultCard').classList.remove('hidden');
}

function copyToClipboard() {
    const textarea = document.getElementById('finalPrompt');
    textarea.select();
    document.execCommand('copy');
    alert('已複製！請貼到您常用的 AI 聊天視窗中即可生成提問。');
}
</script>
</body>
</html>
