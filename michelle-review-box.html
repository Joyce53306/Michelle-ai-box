<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Michelle's Review Box - 完整版</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-6">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-black text-slate-800 mb-6">📦 Michelle's Review Box</h1>
        
        <!-- 課程選擇區域 -->
        <div class="grid grid-cols-3 gap-4 mb-8">
            <div class="p-4 bg-white rounded-xl shadow-sm border">
                <h2 class="font-bold text-slate-700">選擇科目</h2>
                <select id="sub" class="w-full mt-2 p-2 border rounded">
                    <option>國文</option>
                    <option>英語</option>
                    <option>數學</option>
                    <option>理化</option>
                    <option>社會</option>
                </select>
            </div>
            <div class="p-4 bg-white rounded-xl shadow-sm border">
                <h2 class="font-bold text-slate-700">選擇年級</h2>
                <select id="grade" class="w-full mt-2 p-2 border rounded">
                    <option>七年級</script>
                    <option>八年級</script>
                    <option>九年級</script>
                </select>
            </div>
            <div class="p-4 bg-white rounded-xl shadow-sm border">
                <h2 class="font-bold text-slate-700">練習模式</h2>
                <select id="mode" class="w-full mt-2 p-2 border rounded">
                    <option>觀念測驗</option>
                    <option>重點解說</option>
                    <option>AI 批改</option>
                </select>
            </div>
        </div>

        <!-- 練習區 -->
        <div class="bg-white p-6 rounded-2xl shadow-lg border">
            <h2 class="text-lg font-bold mb-4">題目輸入</h2>
            <textarea id="userInput" class="w-full h-32 p-4 border rounded-xl" placeholder="請輸入本週重點或題目..."></textarea>
            <button id="genBtn" class="mt-4 w-full bg-indigo-600 text-white font-bold py-3 rounded-xl hover:bg-indigo-700">
                ✨ 開始複習與練習
            </button>
        </div>
    </div>
</body>
</html>
