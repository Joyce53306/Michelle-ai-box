<style>
body { background: linear-gradient(135deg, #f8fafc 0%, #f0f4ff 50%, #f8fafc 100%); font-family: system-ui, -apple-system, sans-serif; color: #1e293b; }
.card { background: rgba(255,255,255,0.92); border: 1.5px solid #e2e8f0; border-radius: 1rem; box-shadow: 0 4px 15px -3px rgba(148,163,184,0.12); }
.tab-btn { border: 1.5px solid #e2e8f0; border-radius: 0.75rem; padding: 0.5rem 0.75rem; font-size: 0.8rem; font-weight: 600; cursor: pointer; background: #fff; color: #64748b; transition: all 0.15s; }
.tab-btn:hover { transform: translateY(-1px); }
.tab-btn.active { color: #fff; border-color: transparent; }
.chip { border: 1.5px solid #e2e8f0; border-radius: 2rem; padding: 4px 12px; font-size: 0.72rem; font-weight: 600; cursor: pointer; background: #fff; color: #64748b; transition: all 0.15s; white-space: nowrap; }
.chip:hover { background: #f8fafc; }
.chip.active { color: #fff; border-color: transparent; }
.mode-btn { border: 1.5px solid #e2e8f0; border-radius: 0.65rem; padding: 0.5rem; font-size: 0.8rem; font-weight: 600; cursor: pointer; background: #fff; color: #64748b; flex: 1; transition: all 0.15s; }
.mode-btn.active { background: #1e293b; border-color: #1e293b; color: #fff; }
.gen-btn { border: none; border-radius: 0.75rem; padding: 0.85rem; font-size: 0.95rem; font-weight: 700; cursor: pointer; color: #fff; width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.5rem; transition: opacity 0.15s; }
.gen-btn:hover { opacity: 0.88; }
.gen-btn:disabled { opacity: 0.45; cursor: not-allowed; }
.out-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 0.75rem; padding: 1.25rem; white-space: pre-wrap; font-size: 0.875rem; line-height: 1.9; color: #334155; min-height: 60px; }
.copy-btn { font-size: 0.72rem; color: #6366f1; border: 1px solid #c7d2fe; border-radius: 0.5rem; padding: 3px 10px; cursor: pointer; background: none; }
.copy-btn:hover { background: #eef2ff; }
.spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.back-btn { display: inline-flex; align-items: center; gap: 5px; color: #6366f1; font-size: 0.82rem; font-weight: 600; text-decoration: none; margin-bottom: 1.25rem; }
.back-btn:hover { text-decoration: underline; }
.rec-badge { display: inline-block; font-size: 0.65rem; padding: 1px 7px; border-radius: 10px; margin-right: 4px; font-weight: 600; }
label.fl { font-size: 0.68rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 4px; }
select { width: 100%; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 0.65rem; padding: 0.5rem 0.75rem; font-size: 0.875rem; color: #1e293b; }
textarea { width: 100%; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 0.65rem; padding: 0.5rem 0.75rem; font-size: 0.875rem; color: #1e293b; resize: none; font-family: inherit; }
select:focus, textarea:focus { outline: none; border-color: #a5b4fc; }
</style>
</head>
<body class="min-h-screen p-4 md:p-8">
<div class="max-w-2xl mx-auto">

  <a href="index.html" class="back-btn">← 返回 Joyce's ABC Base</a>

  <!-- 頂部 -->
  <div class="card p-5 mb-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-11 h-11 bg-indigo-100 text-indigo-600 rounded-xl flex items-center justify-center text-xl">📦</div>
      <div>
        <h1 class="text-lg font-extrabold text-slate-800">Michelle's Review Box</h1>
        <p class="text-xs text-slate-400">國中五科 × 三年級 AI 學習夥伴</p>
      </div>
    </div>
    <button onclick="toggleRec()" class="text-xs bg-indigo-50 text-indigo-600 border border-indigo-200 rounded-full px-3 py-1.5 font-bold cursor-pointer">
      📊 <span id="totalBadge">0</span> 次練習
    </button>
  </div>

  <!-- 學習紀錄 -->
  <div class="card p-4 mb-4" id="recPanel" style="display:none">
    <div class="grid grid-cols-6 gap-2 mb-3">
      <div class="bg-slate-50 rounded-lg p-2 text-center"><div class="text-lg font-bold" id="sTotal">0</div><div class="text-xs text-slate-400">總計</div></div>
      <div class="bg-indigo-50 rounded-lg p-2 text-center"><div class="text-lg font-bold text-indigo-700" id="sZh">0</div><div class="text-xs text-slate-400">國文</div></div>
      <div class="bg-emerald-50 rounded-lg p-2 text-center"><div class="text-lg font-bold text-emerald-700" id="sEn">0</div><div class="text-xs text-slate-400">英文</div></div>
      <div class="bg-amber-50 rounded-lg p-2 text-center"><div class="text-lg font-bold text-amber-700" id="sSs">0</div><div class="text-xs text-slate-400">社會</div></div>
      <div class="bg-sky-50 rounded-lg p-2 text-center"><div class="text-lg font-bold text-sky-700" id="sMath">0</div><div class="text-xs text-slate-400">數學</div></div>
      <div class="bg-green-50 rounded-lg p-2 text-center"><div class="text-lg font-bold text-green-700" id="sSci">0</div><div class="text-xs text-slate-400">自然</div></div>
    </div>
    <div id="recList" class="text-xs text-slate-400 mb-2">還沒有記錄，快開始練習吧！</div>
    <button onclick="clearRec()" class="text-xs text-red-400 border border-red-200 rounded-full px-3 py-1 cursor-pointer bg-transparent">清除記錄</button>
  </div>

  <!-- 主卡片 -->
  <div class="card p-5 mb-4">

    <!-- 科目 -->
    <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">科目</div>
    <div class="flex gap-2 flex-wrap mb-4" id="subjectRow"></div>

    <!-- 年級 -->
    <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">年級</div>
    <div class="flex gap-2 mb-4">
      <button class="tab-btn active" id="g-g7" onclick="setGrade('g7')" style="background:#1e293b;color:#fff;border-color:#1e293b;">七年級</button>
      <button class="tab-btn" id="g-g8" onclick="setGrade('g8')">八年級</button>
      <button class="tab-btn" id="g-g9" onclick="setGrade('g9')">九年級</button>
    </div>

    <!-- 單元 -->
    <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">單元</div>
    <div class="flex gap-2 flex-wrap mb-4" id="sectionRow"></div>

    <!-- 主題 -->
    <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">細項主題</div>
    <div class="mb-4"><select id="topicSel"></select></div>

    <!-- 模式 -->
    <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">練習模式</div>
    <div class="flex gap-2 mb-4">
      <button class="mode-btn active" id="mode-quiz" onclick="setMode('quiz')">📝 出題測驗</button>
      <button class="mode-btn" id="mode-explain" onclick="setMode('explain')">💡 觀念解釋</button>
      <button class="mode-btn" id="mode-grade" onclick="setMode('grade')">✅ 批改作答</button>
    </div>

    <!-- 題型 -->
    <div id="qtSec">
      <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">題型</div>
      <div class="flex gap-2 flex-wrap mb-4" id="qtRow"></div>
    </div>

    <!-- 解釋風格 -->
    <div id="esSec" style="display:none">
      <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">解釋風格</div>
      <div class="flex gap-2 flex-wrap mb-4" id="esRow"></div>
    </div>

    <!-- 輸入框 -->
    <div class="mb-3">
      <textarea id="userInput" rows="3" placeholder="（可選填）補充說明，或貼上你的作答內容"></textarea>
      <p class="text-xs text-slate-300 mt-1" id="inputHint">選好題型後按「開始練習」，AI 老師幫你出題</p>
    </div>

    <!-- 按鈕 -->
    <div class="flex gap-2">
      <button class="gen-btn" id="genBtn" onclick="startAI()" style="background:#534AB7;">✨ 開始練習</button>
      <button onclick="clearOut()" class="border border-slate-200 rounded-xl px-4 text-sm text-slate-500 cursor-pointer bg-white">清除</button>
    </div>
  </div>

  <!-- 圖表 -->
  <div class="card p-4 mb-4" id="chartWrap" style="display:none">
    <canvas id="myChart"></canvas>
  </div>

  <!-- 輸出 -->
  <div class="card p-5" id="outZone" style="display:none">
    <div class="flex items-center justify-between mb-3">
      <h2 class="font-bold text-slate-700 text-sm">📋 AI 老師回覆</h2>
      <button class="copy-btn" onclick="copyOut()">📋 複製</button>
    </div>
    <div class="out-box" id="outContent"></div>
  </div>

</div><!-- /max-w -->

  match:'設計配對題：左欄5個詞彙，右欄5個定義，學生用字母配數字',
  scenario:'設計2道情境題：先描述生活情境再提問，學生運用所學回答',
  chart:'先描述一組資料，設計2題判讀問題，並在JSON_CHART標記附上圖表',
  order:'設計一題排序題（5-6個打亂的事件）+ 一題是非判斷並說明理由',
  short:'設計2道簡答題，每題要求2-3句回答，附上作答方向提示'
};
const EP = {
  story:'用一個生動的故事帶出觀念，故事後條列3個重點，最後一句話總結',
  step:'用清晰步驟條列解釋（步驟1→2→3），每步附例子，最後整理重點',
  compare:'用對比方式解釋（正確vs錯誤），附文字比較表，說明如何辨別',
  visual:'解釋觀念並在JSON_CHART標記附上圖表，說明圖表意義，最後出一題測驗'
};
const CFMT = 'JSON_CHART {"type":"bar或pie或line","title":"標題","data":{"labels":["A","B","C"],"datasets":[{"label":"說明","data":[10,20,30],"backgroundColor":["#534AB7","#0F6E56","#854F0B","#185FA5","#3B6D11"]}]}}';

// ── 狀態 ──
let cur = { sub:'zh', grade:'g7', sec:null, mode:'quiz', qt:'mix', es:'story' };
let records = JSON.parse(localStorage.getItem('mrb2_rec') || '[]');
let counts  = JSON.parse(localStorage.getItem('mrb2_cnt') || '{"zh":0,"en":0,"ss":0,"math":0,"sci":0}');
let chartInst = null;

// ── 初始化 ──
(function(){
  // 科目按鈕
  const sr = document.getElementById('subjectRow');
  Object.entries(CURRICULUM).forEach(([k,s])=>{
    const b = document.createElement('button');
    b.className = 'tab-btn' + (k==='zh'?' active':'');
    b.id = 'sub-'+k;
    b.innerHTML = s.emoji+' '+s.label;
    if(k==='zh') b.style.cssText=`background:${s.color};color:#fff;border-color:${s.color}`;
    b.onclick = ()=>setSub(k);
    sr.appendChild(b);
  });
  // 題型
  const qr = document.getElementById('qtRow');
  QTYPES.forEach((q,i)=>{
    const b = document.createElement('button');
    b.className = 'chip'+(i===0?' active':'');
    b.id='qt-'+q.id; b.textContent=q.label;
    if(i===0) b.style.cssText='background:#534AB7;color:#fff;border-color:#534AB7';
    b.onclick=()=>setQt(q.id); qr.appendChild(b);
  });
  // 解釋風格
  const er = document.getElementById('esRow');
  ESTYLES.forEach((s,i)=>{
    const b = document.createElement('button');
    b.className='chip'+(i===0?' active':'');
    b.id='es-'+s.id; b.textContent=s.label;
    if(i===0) b.style.cssText='background:#534AB7;color:#fff;border-color:#534AB7';
    b.onclick=()=>setEs(s.id); er.appendChild(b);
  });
  refreshGrade();
  renderRec();
})();

function setSub(s){
  cur.sub=s; cur.sec=null;
  Object.entries(CURRICULUM).forEach(([k,sub])=>{
    const b=document.getElementById('sub-'+k);
    if(k===s){b.classList.add('active');b.style.cssText=`background:${sub.color};color:#fff;border-color:${sub.color}`;}
    else{b.classList.remove('active');b.style.cssText='';}
  });
  document.getElementById('genBtn').style.background=CURRICULUM[s].color;
  refreshGrade();
}

function setGrade(g){
  cur.grade=g; cur.sec=null;
  ['g7','g8','g9'].forEach(x=>{
    const b=document.getElementById('g-'+x);
    if(x===g){b.style.cssText='background:#1e293b;color:#fff;border-color:#1e293b';}
    else{b.style.cssText='';}
  });
  refreshGrade();
}

function refreshGrade(){
  const secs=CURRICULUM[cur.sub].grades[cur.grade].sections;
  const keys=Object.keys(secs);
  if(!cur.sec||!secs[cur.sec]) cur.sec=keys[0];
  const sr=document.getElementById('sectionRow');
  sr.innerHTML='';
  const sub=CURRICULUM[cur.sub];
  keys.forEach(k=>{
    const b=document.createElement('button');
    b.className='chip'+(k===cur.sec?' active':'');
    b.textContent=k;
    if(k===cur.sec) b.style.cssText=`background:${sub.color};color:#fff;border-color:${sub.color}`;
    b.onclick=()=>{
      cur.sec=k;
      document.querySelectorAll('#sectionRow .chip').forEach(x=>{x.classList.remove('active');x.style.cssText='';});
      b.classList.add('active'); b.style.cssText=`background:${sub.color};color:#fff;border-color:${sub.color}`;
      refreshTopics();
    };
    sr.appendChild(b);
  });
  refreshTopics();
}

function refreshTopics(){
  const topics=CURRICULUM[cur.sub].grades[cur.grade].sections[cur.sec]||[];
  const sel=document.getElementById('topicSel');
  sel.innerHTML=topics.map(t=>`<option>${t}</option>`).join('');
}

function setMode(m){
  cur.mode=m;
  ['quiz','explain','grade'].forEach(x=>{
    document.getElementById('mode-'+x).className='mode-btn'+(x===m?' active':'');
  });
  document.getElementById('qtSec').style.display=m==='quiz'?'block':'none';
  document.getElementById('esSec').style.display=m==='explain'?'block':'none';
  const hints={quiz:'選好題型後按「開始練習」，AI 老師幫你出題',explain:'選好風格後按「開始練習」，AI 老師解說觀念',grade:'把你的作答貼到下方，AI 老師幫你批改'};
  document.getElementById('inputHint').textContent=hints[m];
  document.getElementById('userInput').placeholder=m==='grade'?'請貼上你的作答內容...':'（可選填）補充說明或指定難度';
}

function setQt(q){
  cur.qt=q;
  const sub=CURRICULUM[cur.sub];
  QTYPES.forEach(x=>{
    const b=document.getElementById('qt-'+x.id);
    if(x.id===q){b.classList.add('active');b.style.cssText=`background:${sub.color};color:#fff;border-color:${sub.color}`;}
    else{b.classList.remove('active');b.style.cssText='';}
  });
}

function setEs(s){
  cur.es=s;
  const sub=CURRICULUM[cur.sub];
  ESTYLES.forEach(x=>{
    const b=document.getElementById('es-'+x.id);
    if(x.id===s){b.classList.add('active');b.style.cssText=`background:${sub.color};color:#fff;border-color:${sub.color}`;}
    else{b.classList.remove('active');b.style.cssText='';}
  });
}

function clearOut(){
  document.getElementById('userInput').value='';
  document.getElementById('outZone').style.display='none';
  document.getElementById('chartWrap').style.display='none';
  if(chartInst){chartInst.destroy();chartInst=null;}
}

function toggleRec(){
  const p=document.getElementById('recPanel');
  p.style.display=p.style.display==='none'?'block':'none';
}

function addRec(){
  counts[cur.sub]=(counts[cur.sub]||0)+1;
  const topic=document.getElementById('topicSel').value;
  const ml={quiz:'出題',explain:'解釋',grade:'批改'}[cur.mode];
  const time=new Date().toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
  records.unshift({sub:cur.sub,grade:cur.grade,sec:cur.sec,topic,ml,time});
  if(records.length>30) records.pop();
  localStorage.setItem('mrb2_rec',JSON.stringify(records));
  localStorage.setItem('mrb2_cnt',JSON.stringify(counts));
  renderRec();
}

function renderRec(){
  const total=Object.values(counts).reduce((a,b)=>a+b,0);
  document.getElementById('totalBadge').textContent=total;
  document.getElementById('sTotal').textContent=total;
  document.getElementById('sZh').textContent=counts.zh||0;
  document.getElementById('sEn').textContent=counts.en||0;
  document.getElementById('sSs').textContent=counts.ss||0;
  document.getElementById('sMath').textContent=counts.math||0;
  document.getElementById('sSci').textContent=counts.sci||0;
  const list=document.getElementById('recList');
  if(!records.length){list.textContent='還沒有記錄，快開始練習吧！';return;}
  list.innerHTML=records.slice(0,10).map(r=>{
    const s=CURRICULUM[r.sub];
    const gl={g7:'七年級',g8:'八年級',g9:'九年級'}[r.grade];
    return `<div class="py-1 border-b border-slate-100 text-xs text-slate-500">
      <span class="rec-badge" style="background:${s.bg};color:${s.text}">${s.label}</span>
      ${gl}・${r.sec}・${r.topic}　${r.ml}
      <span class="float-right text-slate-300">${r.time}</span>
    </div>`;
  }).join('');
}

function clearRec(){
  if(!confirm('確定清除所有學習紀錄？')) return;
  records=[]; counts={zh:0,en:0,ss:0,math:0,sci:0};
  localStorage.setItem('mrb2_rec','[]');
  localStorage.setItem('mrb2_cnt',JSON.stringify(counts));
  renderRec();
}

function tryChart(text){
  const m=text.match(/JSON_CHART\s*(\{[\s\S]*?\})/);
  if(!m) return text;
  try{
    const cfg=JSON.parse(m[1]);
    document.getElementById('chartWrap').style.display='block';
    if(chartInst) chartInst.destroy();
    chartInst=new Chart(document.getElementById('myChart').getContext('2d'),{
      type:cfg.type||'bar', data:cfg.data,
      options:{responsive:true,plugins:{legend:{position:'bottom'},title:{display:!!cfg.title,text:cfg.title||''}},
        scales:['pie','doughnut'].includes(cfg.type)?{}:{y:{beginAtZero:true}}}
    });
    return text.replace(/JSON_CHART\s*\{[\s\S]*?\}/,'📊 圖表已顯示於上方');
  }catch(e){ return text.replace(/JSON_CHART[\s\S]*/,''); }
}

async function startAI(){
  const topic=document.getElementById('topicSel').value;
  const userText=document.getElementById('userInput').value.trim();
  const sub=CURRICULUM[cur.sub];
  const gl=sub.grades[cur.grade].label;

  const system=`你是一位親切專業的${sub.label}老師，學生叫 Michelle，目前${gl}（英文程度已達國三上）。請全程用繁體中文，語氣溫暖鼓勵、條理清晰。`;

  let prompt='';
  if(cur.mode==='quiz'){
    const nc=cur.qt==='chart';
    prompt=`請針對「${gl}・${cur.sec}」的主題「${topic}」出題。要求：${QP[cur.qt]}。${nc?'圖表格式：'+CFMT:''}${userText?'\n補充：'+userText:''}`;
  } else if(cur.mode==='explain'){
    const nc=cur.es==='visual';
    prompt=`請解釋「${gl}・${cur.sec}」中的「${topic}」。解釋方式：${EP[cur.es]}。${nc?'圖表格式：'+CFMT:''}${userText?'\nMichelle補充：'+userText:''}`;
  } else {
    if(!userText){ showOut('請先在上方輸入你的作答內容，AI 老師才能幫你批改喔！'); return; }
    prompt=`Michelle 針對「${gl}・${topic}」作答如下，請鼓勵性批改：①肯定優點 ②指出錯誤並說明原因 ③給出正確觀念 ④建議改進方向。最後給1-10分。\n\nMichelle的作答：${userText}`;
  }

  const btn=document.getElementById('genBtn');
  btn.disabled=true;
  btn.innerHTML='<span class="spinner"></span> AI 老師思考中…';
  document.getElementById('chartWrap').style.display='none';
  if(chartInst){chartInst.destroy();chartInst=null;}
  showOut('⏳ 生成中，請稍候...');
  addRec();

  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1200,system,messages:[{role:'user',content:prompt}]})
    });
    const data=await res.json();
    let text=data.content?.map(c=>c.text||'').join('')||'抱歉發生問題，請再試一次。';
    text=tryChart(text);
    showOut(text);
  }catch(e){ showOut('連線發生問題，請稍後再試。'); }
  btn.disabled=false;
  btn.innerHTML='✨ 開始練習';
}

function showOut(txt){
  document.getElementById('outZone').style.display='block';
  document.getElementById('outContent').textContent=txt;
}

function copyOut(){
  navigator.clipboard.writeText(document.getElementById('outContent').textContent).then(()=>{
    const b=document.querySelector('.copy-btn');
    const o=b.innerHTML; b.innerHTML='✅ 已複製！';
    setTimeout(()=>b.innerHTML=o,1500);
  });
}
</script>
</body>
</html>
