<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>音樂設計師 - Prompt 生成器</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-4 md:p-8 bg-slate-50">
<div class="max-w-2xl mx-auto">
    <a href="index.html" class="text-purple-600 mb-6 block">← 返回控制台</a>
    <div class="card p-6 bg-white border rounded-2xl shadow-sm">
        <h1 class="text-xl font-bold mb-4">🎵 音樂設計師 (Prompt 模式)</h1>
        <div class="space-y-4">
            <input type="text" id="goal" class="w-full border p-2 rounded" placeholder="教學目標 (例: 學習顏色 red, blue)">
            <select id="style" class="w-full border p-2 rounded">
                <option>兒童流行曲 (Upbeat Pop)</option>
                <option>童謠風 (Nursery Rhyme)</option>
                <option>兒童說唱 (Kids Hip Hop)</option>
            </select>
            <button onclick="generatePrompt()" class="w-full bg-purple-600 text-white py-3 rounded-xl font-bold hover:bg-purple-700">📋 生成並複製指令</button>
        </div>
    </div>

    <div id="resultCard" class="card hidden p-6 bg-white border rounded-2xl shadow-sm mt-6">
        <h2 class="font-bold mb-2">請複製下方指令，貼給 AI 生成：</h2>
        <textarea id="finalPrompt" class="w-full h-40 p-3 bg-slate-100 text-xs rounded mb-3" readonly></textarea>
        <button onclick="copyToClipboard()" class="w-full border border-purple-600 text-purple-600 py-2 rounded-lg font-bold">複製到剪貼簿</button>
    </div>
</div>

<script>
function generatePrompt() {
    const goal = document.getElementById('goal').value || '兒童英語教學';
    const style = document.getElementById('style').value;
    
    const prompt = `你是一位幼兒英語音樂專家。請根據以下要求生成一首歌：
教學目標：${goal}
音樂風格：${style}

請生成：
1. 【歌詞】：適合 3-6 歲，多重複、押韻、朗朗上口。中英對照。
2. 【Suno 提示詞】：精準的音樂風格描述（英文），適合貼入 Suno 的 Style 欄位。`;
    
    document.getElementById('finalPrompt').value = prompt;
    document.getElementById('resultCard').classList.remove('hidden');
}

function copyToClipboard() {
    const textarea = document.getElementById('finalPrompt');
    textarea.select();
    document.execCommand('copy');
    alert('已複製指令！現在貼給 AI 即可生成精美的歌詞與音樂提示詞。');
}
</script>
</body>
</html>
