<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>學習單生成器 - Prompt 模式</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
    body { background: #fdfaf6; font-family: system-ui, sans-serif; }
    .card { background: #fff; border: 1.5px solid #e2e8f0; border-radius: 1rem; padding: 1.5rem; }
    .type-btn.active { border-color: #d97706; background: #fffbeb; color: #92400e; }
</style>
</head>
<body class="p-4 md:p-8">
<div class="max-w-2xl mx-auto">
    <a href="index.html" class="text-amber-700 mb-6 block">← 返回控制台</a>
    <div class="card mb-6">
        <h1 class="text-xl font-bold mb-4">📄 學習單生成器</h1>
        <div class="grid grid-cols-2 gap-4 mb-4">
            <input type="text" id="theme" class="border p-2 rounded" placeholder="主題 (例: Animals)">
            <input type="text" id="vocab" class="border p-2 rounded" placeholder="單字 (例: cat, dog)">
        </div>
        <button onclick="generatePrompt()" class="w-full bg-amber-600 text-white py-3 rounded-xl font-bold hover:bg-amber-700">📋 生成指令並複製</button>
    </div>

    <div id="resultCard" class="card hidden">
        <h2 class="font-bold mb-2">請複製下方指令，貼給 AI 生成：</h2>
        <textarea id="finalPrompt" class="w-full h-40 p-3 bg-slate-100 text-xs rounded mb-3" readonly></textarea>
        <button onclick="copyToClipboard()" class="w-full border border-amber-600 text-amber-600 py-2 rounded-lg font-bold">複製到剪貼簿</button>
    </div>
</div>

<script>
function generatePrompt() {
    const theme = document.getElementById('theme').value || '通用主題';
    const vocab = document.getElementById('vocab').value || '基礎單字';
    
    const prompt = `你是一位專業幼兒 ESL 老師。請幫我設計一份適合 3-6 歲幼兒的英語學習單。
主題：${theme}
目標單字：${vocab}

內容包含：
1. 視覺化連連看 (Look and match)
2. 描寫練習 (Trace and write)
3. 塗色題 (Coloring fun)

要求：
- 使用簡單明瞭的教學指令 (英文 + 中文)
- 融入有趣的動物森林冒險情境
- 確保版面清晰，適合幼兒手寫與互動。`;

    document.getElementById('finalPrompt').value = prompt;
    document.getElementById('resultCard').classList.remove('hidden');
}

function copyToClipboard() {
    const textarea = document.getElementById('finalPrompt');
    textarea.select();
    document.execCommand('copy');
    alert('已複製！請貼到您常用的 AI 聊天視窗中。');
}
</script>
</body>
</html>
</html>
